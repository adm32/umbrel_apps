<!doctype html>
<html lang="en" data-theme="light" data-glass="frosted">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Vitals</title>
  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { overflow: auto; }
    .loginwrap { position: relative; z-index: 1; min-height: 100%; display: grid; place-items: center; padding: 24px 16px; }
    .logincard { width: min(380px, 100%); padding: 30px 28px 26px; border-radius: 28px; text-align: center; }
    .logincard img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 8px 24px rgba(194, 65, 12, 0.3); }
    .logincard h1 { font-size: 22px; letter-spacing: -0.03em; margin: 16px 0 4px; }
    .logincard p { margin: 0 0 20px; color: var(--text-2); font-size: 14px; }
    .logincard form { display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .logincard .input { width: 100%; height: 44px; font-size: 15px; }
    .logincard .code { letter-spacing: 0.3em; text-align: center; font-variant-numeric: tabular-nums; font-size: 20px; }
    .logincard .btn { height: 44px; width: 100%; margin-top: 4px; font-size: 15px; }
    .logincard .remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); margin: 2px 2px 0; cursor: pointer; }
    .logincard .msg { min-height: 20px; font-size: 13px; color: var(--critical-text); text-align: center; }
    .logincard .note { font-size: 12px; color: var(--text-3); margin-top: 14px; line-height: 1.5; }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <div class="wallpaper" data-builtin="white" aria-hidden="true"></div>
  <main class="loginwrap">
    <div class="logincard glass">
      <img src="img/icon.svg" alt="">
      <h1 id="title">Sign in to Vitals</h1>
      <p id="sub">You're connecting from outside your home network.</p>
      <form id="form" autocomplete="on" novalidate>
        <input class="input hide" id="setupCode" placeholder="Setup code (XXXX-XXXX-XXXX-XXXX)" autocomplete="off" spellcheck="false">
        <input class="input" id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <input class="input hide" id="confirm" type="password" placeholder="Repeat the password" autocomplete="new-password">
        <input class="input code hide" id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" autocomplete="one-time-code">
        <label class="remember" id="rememberRow"><input type="checkbox" class="check" id="remember" checked> Keep me signed in for 30 days</label>
        <div class="msg" id="msg" role="alert"></div>
        <button class="btn primary" id="go" type="submit">Sign in</button>
      </form>
      <div class="note" id="note"></div>
    </div>
  </main>
  <script type="module" src="js/login.js"></script>
</body>
</html>
